name: Windows

permissions:
  contents: read

on:
  push:
    branches:
    - master
    - '[0-9]+.[0-9]+'
  pull_request:

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            toxenv: py310
            coverage: false
          - python-version: "3.11"
            toxenv: py311
            coverage: false
          - python-version: "3.12"
            toxenv: py312
            coverage: false
          - python-version: "3.13"
            toxenv: py313
            coverage: false
          - python-version: "3.14"
            toxenv: py314
            coverage: true
          - python-version: "3.14"
            toxenv: default-reactor
            coverage: false
          - python-version: "3.14"
            toxenv: no-reactor
            coverage: false
          - python-version: "3.14"
            toxenv: extra-deps
            coverage: false
          - python-version: "3.10"
            toxenv: min
            coverage: false
          - python-version: "3.10"
            toxenv: min-extra-deps
            coverage: false
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10
      - name: Install tox
        env:
          UV_PYTHON_PREFERENCE: "only-system"
          UV_PYTHON_DOWNLOADS: "never"
        run: uv tool install --python ${{ matrix.python-version }} tox --with tox-uv
      - name: Install mitmproxy
        env:
          UV_PYTHON_PREFERENCE: "system"
        run: uv tool install mitmproxy
      - name: Run tests
        env:
          UV_PYTHON_PREFERENCE: "only-system"
          UV_PYTHON_DOWNLOADS: "never"
        run: tox -e ${{ matrix.toxenv }} -x testenv.constrain_package_deps=true -- -n auto ${{ matrix.coverage == false && '--no-cov' || '' }}
      - name: Upload coverage report
        if: ${{ matrix.coverage && success() }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: "./*.junit.xml"
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
