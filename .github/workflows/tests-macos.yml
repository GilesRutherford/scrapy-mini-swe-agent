name: macOS

permissions:
  contents: read

on:
  push:
    branches:
    - master
    - '[0-9]+.[0-9]+'
  pull_request:

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  tests:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        toxenv: [py]
        include:
          - python-version: "3.14"
            toxenv: no-reactor
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install mitmproxy
        run: uv tool install --python-preference system mitmproxy

      - name: Run tests
        env:
          UV_PYTHON_DOWNLOADS: never
          PYTEST_ADDOPTS: ${{ (matrix.python-version == '3.14' && matrix.toxenv == 'py') && '-n auto' || '-n auto --no-cov' }}
        run: |
          uvx --python "${{ env.pythonLocation }}/bin/python" --with tox-uv tox \
            --override 'testenv.constrain_package_deps=true' \
            --override 'testenv.deps+=parsel==1.11.0' \
            -e "${{ matrix.toxenv }}"

      - name: Upload coverage to Codecov
        if: ${{ success() && matrix.python-version == '3.14' && matrix.toxenv == 'py' }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: macos
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          files: testenv.junit.xml
          flags: macos
          fail_ci_if_error: true
